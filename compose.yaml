name: letta-a2a-server-dev
services:
  server:
    build: .
    init: true
    ports:
      - "127.0.0.1:${A2A_PORT:-41241}:41241"
    environment:
      A2A_LISTEN_HOST: "0.0.0.0"
      BUN_INSTALL_CACHE_DIR: /home/node/.cache/bun
      npm_config_cache: /home/node/.cache/npm
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./tests
        target: /app/tests
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./scripts
        target: /app/scripts
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./package.json
        target: /app/package.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./package-lock.json
        target: /app/package-lock.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./tsconfig.json
        target: /app/tsconfig.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./tsconfig.build.json
        target: /app/tsconfig.build.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${A2A_CONFIG_FILE:-./config.example.json}
        target: /app/config.local.json
        read_only: true
        bind: { create_host_path: false }
      - dependencies:/app/node_modules
      - runtime:/home/node/.letta
      - cache:/home/node/.cache
    command: ["npm", "run", "dev"]
volumes:
  dependencies:
  runtime:
  cache:
