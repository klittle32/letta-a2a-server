name: letta-a2a-server-dev

x-server: &server
  build: .
  image: letta-a2a-server:dev
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:41241/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
    interval: 30s
    timeout: 5s
    start_period: 30s
    retries: 3

services:
  server:
    <<: *server
    ports:
      - "127.0.0.1:41241:41241"
    environment:
      A2A_LISTEN_HOST: "0.0.0.0"
      LETTA_API_KEY: "${LETTA_API_KEY:-}"
    volumes:
      - type: bind
        source: ${A2A_CONFIG_FILE:-./config.cloud.local.json}
        target: /app/config.local.json
        read_only: true
        bind: { create_host_path: false }
      - cloud-runtime:/home/node/.letta

  local:
    <<: *server
    ports:
      - "127.0.0.1:41242:41241"
    environment:
      A2A_LISTEN_HOST: "0.0.0.0"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - type: bind
        source: ${A2A_LOCAL_CONFIG_FILE:-./config.local.json}
        target: /app/config.local.json
        read_only: true
        bind: { create_host_path: false }
      - runtime:/home/node/.letta

volumes:
  cloud-runtime:
  runtime:
